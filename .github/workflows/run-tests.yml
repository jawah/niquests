name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: >-
      ${{ matrix.nox-session == 'wasi' && 'WASI · Wasmtime' ||
          startsWith(matrix.nox-session, 'emscripten(') && format('Emscripten · {0}', fromJSON('{"emscripten(node)":"Node.js","emscripten(firefox)":"Firefox","emscripten(chrome)":"Chrome"}')[matrix.nox-session]) ||
          matrix.python-version == 'pypy-3.11' && 'PyPy 3.11' ||
          format('CPython {0}', matrix.python-version) }} ·
      ${{ fromJSON('{"ubuntu-22.04":"Ubuntu 22.04","ubuntu-24.04":"Ubuntu 24.04","macos-15-intel":"macOS 15","windows-latest":"Windows"}')[matrix.os] }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [ubuntu-22.04, macos-15-intel, windows-latest]
        nox-session: ['']
        traefik-server: [true]
        include:
          - python-version: "3.13"
            os: ubuntu-22.04
            nox-session: ''
            traefik-server: true
          - python-version: "3.13"
            os: ubuntu-24.04
            nox-session: emscripten(node)
            traefik-server: true
          - python-version: "3.13"
            os: ubuntu-24.04
            nox-session: emscripten(firefox)
            traefik-server: true
          - python-version: "3.13"
            os: ubuntu-24.04
            nox-session: emscripten(chrome)
            traefik-server: true
          - python-version: "3.13"
            os: ubuntu-24.04
            nox-session: wasi
          - python-version: "pypy-3.11"
            os: ubuntu-24.04
            nox-session: "test-pypy3.11"
        exclude:
          - python-version: "3.7"
            os: macos-15-intel
          - python-version: "3.8"
            os: macos-15-intel

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'
    - name: Setup Wasmtime
      if: ${{ matrix.nox-session == 'wasi' }}
      uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
      with:
        version: "47.0.1"
    - name: "Install Chrome"
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      id: setup-chrome
      if: ${{ matrix.nox-session == 'emscripten(chrome)' }}
      with:
        install-chromedriver: true
    - name: Force override system chrome
      env:
        CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      run: |
        sudo rm -f /usr/bin/google-chrome
        sudo rm -f /usr/bin/chrome
        sudo ln -s $CHROME_PATH /usr/bin/google-chrome
        sudo ln -s $CHROME_PATH /usr/bin/chrome
        google-chrome --version
      if: ${{ matrix.nox-session == 'emscripten(chrome)' }}
    - name: "Install Firefox"
      uses: browser-actions/setup-firefox@5914774dda97099441f02628f8d46411fcfbd208 # v1.7.0
      if: ${{ matrix.nox-session == 'emscripten(firefox)' }}
    - name: "Install node.js"
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ matrix.nox-session == 'emscripten(node)' }}
      with:
        node-version: 24
    - name: "Traefik: Setup Docker - Colima (MacOS)"
      if: ${{ matrix.traefik-server && contains(matrix.os, 'mac') }}
      uses: douglascamata/setup-docker-macos-action@d5ccc6aae0ce23e7700154f5e63cc53e6433ac48
      with:
        colima-network-address: true
    - name: "Get Colima VM IP Address (MacOS)"
      if: ${{ matrix.traefik-server && contains(matrix.os, 'mac') }}
      id: colima-ip
      run: |
        # Get the IP address from colima list output
        COLIMA_IP=$(colima list | grep -E "^\s*default\s+" | awk '{print $NF}')

        # Fallback to default if not found
        if [ -z "$COLIMA_IP" ]; then
          echo "::warning: could not read IP address from 'colima list'"
          colima list
          COLIMA_IP="192.168.65.2"
        fi

        echo "autodiscover=$COLIMA_IP" >> $GITHUB_OUTPUT
        echo "Colima VM IP: $COLIMA_IP"
    - name: "Ensure Docker is ready (Windows)"
      # Workaround for https://github.com/actions/runner-images/issues/13729
      if: ${{ contains(matrix.os, 'windows') && matrix.traefik-server }}
      shell: pwsh
      run: |
        $svc = Get-Service docker -ErrorAction SilentlyContinue
        if (-not $svc) {
          Write-Error "Docker service not found"
          exit 1
        }
        if ($svc.Status -ne 'Running') {
          Write-Host "Docker service status: $($svc.Status). Starting..."
          Start-Service docker -ErrorAction Stop
        }
        $timeout = 120
        while ($timeout -gt 0) {
          & docker info >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Docker is ready"
            exit 0
          }
          Write-Host "Waiting for Docker daemon... (${timeout}s remaining)"
          Start-Sleep -Seconds 3
          $timeout -= 3
        }
        Write-Error "Docker daemon did not become ready within 120s"
        exit 1
    - name: Install dependencies
      run: |
        pip install nox
    - name: Start local protocol stack for WASI
      if: ${{ matrix.nox-session == 'wasi' }}
      run: nox -s local_server -- --no-revocation
      env:
        TRAEFIK_HTTPBIN_ENABLE: "true"
    - name: Run tests
      # see https://github.com/actions/runner-images/issues/10924
      # for context on why macOS runner need sudo(...)
      run: |
        ${{ contains(matrix.os, 'mac') && 'sudo -E' || '' }} nox -s "${{ matrix.nox-session != '' && matrix.nox-session || format('test-{0}', matrix.python-version) }}"
      env:
        TRAEFIK_HTTPBIN_ENABLE: ${{ matrix.traefik-server }}
        TRAEFIK_HTTPBIN_IPV4: ${{ contains(matrix.os, 'mac') && steps.colima-ip.outputs.autodiscover || '127.0.0.1' }}
    - name: Stop local protocol stack for WASI
      if: ${{ always() && matrix.nox-session == 'wasi' }}
      run: docker compose -f docker-compose.yaml stop
    - name: "Upload artifact"
      uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f"
      with:
        name: coverage-data-${{ matrix.os }}-${{ matrix.nox-session }}-${{ matrix.python-version }}-${{ matrix.traefik-server }}
        path: ".coverage.*"
        include-hidden-files: true
        if-no-files-found: error

  coverage:
    if: always()
    runs-on: "ubuntu-latest"
    needs: build
    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"
        with:
          persist-credentials: false

      - name: "Setup Python"
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97"
        with:
          python-version: "3.x"

      - name: "Install coverage"
        run: "python -m pip install --upgrade coverage"

      - name: "Download artifact"
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: coverage-data*
          merge-multiple: true

      - name: "Combine & check coverage"
        run: |
          python -m coverage combine
          python -m coverage html --skip-covered --skip-empty --ignore-errors
          python -m coverage report --ignore-errors --show-missing --fail-under=70

      - name: "Upload report"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: coverage-report
          path: htmlcov
